<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대전권 대학 사서 채용공고</title>
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#1d1d1b;--mut:#6b6b66;--bd:#e3e3de;--ac:#2f5d50;--new:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--card:#20201e;--tx:#ececE8;--mut:#9a9a94;--bd:#33332f;--ac:#7fc4ae;--new:#fb923c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mut);font-size:13px;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 12px;border-radius:99px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);border-color:var(--ac);color:var(--bg)}
a.card{display:block;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px 14px;margin-bottom:8px;text-decoration:none;color:inherit}
a.card:hover{border-color:var(--ac)}
.meta{font-size:12px;color:var(--mut);display:flex;gap:8px;align-items:center}
.school{color:var(--ac);font-weight:600}
.t{margin-top:3px;font-size:15px}
.new{color:var(--new);font-weight:700}
.empty,.err{color:var(--mut);font-size:13px;padding:20px 0}
.err{border-top:1px solid var(--bd);margin-top:20px;padding-top:12px}
</style>
</head>
<body>
<main>
  <h1>대전권 대학 사서 채용공고</h1>
  <div class="sub" id="upd">불러오는 중…</div>
  <div class="chips" id="chips"></div>
  <div id="list"></div>
  <div class="err" id="err" hidden></div>
</main>
<script>
var sel = "전체", data = {jobs: [], errors: []};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function isNew(j){return (Date.now()-new Date(j.first_seen))/864e5 <= 3}
function render(){
  var schools = ["전체"].concat(Array.from(new Set(data.jobs.map(function(j){return j.school}))));
  document.getElementById("chips").innerHTML = schools.map(function(s){
    return '<button class="chip'+(s===sel?' on':'')+'" data-s="'+esc(s)+'">'+esc(s)+'</button>'}).join("");
  var rows = data.jobs.filter(function(j){return sel==="전체"||j.school===sel});
  document.getElementById("list").innerHTML = rows.length ? rows.map(function(j){
    return '<a class="card" href="'+esc(j.url)+'" target="_blank" rel="noopener"><div class="meta"><span class="school">'+esc(j.school)+'</span><span>'+esc(j.date||j.first_seen)+'</span>'+(isNew(j)?'<span class="new">NEW</span>':'')+'</div><div class="t">'+esc(j.title)+'</div></a>'}).join("")
    : '<div class="empty">현재 수집된 사서 채용공고가 없습니다.</div>';
}
document.getElementById("chips").addEventListener("click", function(e){
  if(e.target.dataset.s){sel = e.target.dataset.s; render();}
});
fetch("jobs.json?"+Date.now()).then(function(r){return r.json()}).then(function(d){
  data = d;
  document.getElementById("upd").textContent = "마지막 업데이트: " + d.updated + " · " + d.jobs.length + "건";
  if(d.errors && d.errors.length){var e=document.getElementById("err");e.hidden=false;e.textContent="수집 실패: "+d.errors.join(" / ")}
  render();
}).catch(function(){document.getElementById("upd").textContent="jobs.json을 불러오지 못했습니다."});
</script>
</body>
</html>
